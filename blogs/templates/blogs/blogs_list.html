{% extends 'blogs/base.html' %}
{% load my_tags %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for blog in blogs %}
            <div class="col">
                <div class="card shadow-sm">
                    {% if blog.photo %}
                    <img src="{{ blog.photo.url }}" class="card-img-top" alt="{{ blog.title }}">
                    {% else %}
                    <img src="/static/images/default-blog.jpg" class="card-img-top" alt="Default image">
                    {% endif %}
                    <div class="card-body">
                        <p class="card-text">{{ blog.title }}</p>
                        <p class="card-text">{{ blog.body|truncatewords:30 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group btn-group-sm w-100" role="group">
                                <a class="btn btn-primary flex-fill" href="{% url 'blogs:blogs_detail' blog.pk %}" role="button">
                                    Подробнее
                                </a>
                                <a class="btn btn-warning flex-fill" href="{% url 'blogs:blogs_update' blog.pk %}" role="button">
                                    Редактировать
                                </a>
                                <a class="btn btn-danger flex-fill" href="{% url 'blogs:blogs_delete' blog.pk %}" role="button">
                                    Удалить
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12">
                <p class="text-center">Пока нет блогов. <a href="{% url 'blogs:blogs_create' %}">Создайте первый!</a></p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
