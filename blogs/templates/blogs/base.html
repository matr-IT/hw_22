{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница с блогами</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css'%}" rel="stylesheet">
</head>
<body>

    <header data-bs-theme="dark">
        {% include 'blogs/includes/inc_blogs_menu.html' %}
    </header>
    <main>
        <section class="py-5 text-center container">
            <div class="row py-lg-5">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-light">Мир блогов</h1>
                    <p class="lead text-body-secondary">Лучший сайт с блогами</p>
                    <p>
                        <a class="btn btn-primary" href="{% url 'blogs:blogs_create' %}" role="button">Создать блог</a>
                    </p>
                </div>
            </div>
        </section>
        {% block content %}
        {% endblock %}
    </main>
    {% include 'blogs/includes/inc_blogs_bottom.html' %}
    <!-- Подключение Bootstrap JavaScript (по желанию, для интерактивности) -->
    <script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>

</body>
</html>
