{% extends 'base.html' %}
{% load my_tags %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Удаление продукта</h4>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        {% if object.image %}
                            <img src="{{ object.image | media_filter }}" class="img-fluid rounded mb-3" alt="{{ object.name }}" style="max-height: 200px;">
                        {% endif %}
                        <h5>Вы уверены, что хотите удалить продукт?</h5>
                        <p class="text-muted">"{{ object.name }}"</p>
                        <p class="text-danger"><strong>Это действие нельзя отменить!</strong></p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">← Отмена</a>
                            <button type="submit" class="btn btn-danger">Удалить навсегда</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
